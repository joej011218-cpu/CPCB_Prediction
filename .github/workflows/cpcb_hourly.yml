name: CPCB Automatic Update

on:
  workflow_dispatch:

concurrency:
  group: cpcb-vadodara-update
  cancel-in-progress: false

jobs:
  update-cpcb:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ======================================================
      # SETUP
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install gdown

      # ======================================================
      # CHECK CPCB FIRST
      #
      # Exit codes from cpcb_collector.py:
      #
      #   0  = API succeeded, no new CPCB timestamp
      #   10 = API succeeded, new CPCB timestamp found
      #   20 = CPCB API unavailable / timeout
      # ======================================================

      - name: Check for new CPCB data
        id: cpcb-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPCB_API_KEY: ${{ secrets.CPCB_API_KEY }}
        shell: bash
        run: |
          set +e

          python cpcb_collector.py --collect-only
          EXIT_CODE=$?

          set -e

          echo "Collector exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 10 ]; then

            echo "New CPCB hour detected."

            echo "new_data=true" >> "$GITHUB_OUTPUT"
            echo "api_available=true" >> "$GITHUB_OUTPUT"

          elif [ "$EXIT_CODE" -eq 0 ]; then

            echo "CPCB API checked successfully."
            echo "No new CPCB hour."

            echo "new_data=false" >> "$GITHUB_OUTPUT"
            echo "api_available=true" >> "$GITHUB_OUTPUT"

          elif [ "$EXIT_CODE" -eq 20 ]; then

            echo "WARNING: CPCB API is currently unavailable."
            echo "Existing database and forecast will be retained."

            echo "new_data=false" >> "$GITHUB_OUTPUT"
            echo "api_available=false" >> "$GITHUB_OUTPUT"

          else

            echo "Unexpected CPCB collector failure."
            echo "Exit code: $EXIT_CODE"

            exit "$EXIT_CODE"

          fi

      # ======================================================
      # RF MODEL CACHE
      #
      # Only runs when a genuinely newer CPCB timestamp exists.
      # ======================================================

      - name: Restore Random Forest model cache
        if: steps.cpcb-check.outputs.new_data == 'true'
        id: rf-cache
        uses: actions/cache@v4
        with:
          path: RF_Deployment
          key: vadodara-rf-models-v1

      # ======================================================
      # DOWNLOAD RF MODELS
      #
      # Only when:
      # 1. New CPCB data exists
      # 2. RF cache is unavailable
      # ======================================================

      - name: Download Random Forest models
        if: >
          steps.cpcb-check.outputs.new_data == 'true' &&
          steps.rf-cache.outputs.cache-hit != 'true'
        run: |
          echo "RF model cache not found."
          echo "Downloading Random Forest deployment package..."

          gdown "https://drive.google.com/uc?id=1K1VMc4iyp7_9PFy2JenPXawA81cnWf1v" \
            -O RF_Deployment.zip

          echo "Downloaded RF package:"
          ls -lh RF_Deployment.zip

      # ======================================================
      # EXTRACT RF MODELS
      # ======================================================

      - name: Extract Random Forest models
        if: >
          steps.cpcb-check.outputs.new_data == 'true' &&
          steps.rf-cache.outputs.cache-hit != 'true'
        run: |
          echo "Extracting Random Forest models..."

          unzip -q RF_Deployment.zip

          echo "Extraction completed."

          du -sh RF_Deployment

          rm -f RF_Deployment.zip

      # ======================================================
      # VERIFY RF MODELS
      # ======================================================

      - name: Verify Random Forest models
        if: steps.cpcb-check.outputs.new_data == 'true'
        run: |
          echo "Verifying Random Forest deployment..."

          test -f "RF_Deployment/horizon_01h/random_forest_delta_model.joblib"
          test -f "RF_Deployment/horizon_01h/feature_columns.joblib"
          test -f "RF_Deployment/horizon_01h/model_config.joblib"

          test -f "RF_Deployment/horizon_24h/random_forest_delta_model.joblib"
          test -f "RF_Deployment/horizon_24h/feature_columns.joblib"
          test -f "RF_Deployment/horizon_24h/model_config.joblib"

          echo "Random Forest models verified successfully."

          du -sh RF_Deployment

      # ======================================================
      # GENERATE NEW RF FORECAST
      #
      # Only runs when new CPCB data was successfully obtained.
      # ======================================================

      - name: Generate Random Forest forecast
        if: steps.cpcb-check.outputs.new_data == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          RF_MODEL_BASE: RF_Deployment
          RF_MODEL_FILENAME: random_forest_delta_model.joblib

        run: |
          echo "=========================================="
          echo "NEW CPCB DATA FOUND"
          echo "STARTING RANDOM FOREST FORECAST"
          echo "=========================================="

          python predictor.py

          echo "=========================================="
          echo "RANDOM FOREST FORECAST FINISHED"
          echo "=========================================="

      # ======================================================
      # API WORKED BUT THERE IS NO NEW CPCB HOUR
      # ======================================================

      - name: No new CPCB data
        if: >
          steps.cpcb-check.outputs.api_available == 'true' &&
          steps.cpcb-check.outputs.new_data == 'false'
        run: |
          echo "=========================================="
          echo "NO NEW CPCB HOUR"
          echo "=========================================="
          echo ""
          echo "CPCB API was checked successfully."
          echo "The latest CPCB timestamp has not changed."
          echo ""
          echo "Existing database retained."
          echo "Existing prediction retained."
          echo "Random Forest models were not restored."
          echo ""
          echo "=========================================="

      # ======================================================
      # CPCB API COULD NOT BE CHECKED
      # ======================================================

      - name: CPCB API unavailable
        if: steps.cpcb-check.outputs.api_available == 'false'
        run: |
          echo "=========================================="
          echo "CPCB API TEMPORARILY UNAVAILABLE"
          echo "=========================================="
          echo ""
          echo "The CPCB API could not be checked successfully."
          echo ""
          echo "This does NOT mean that there is no new CPCB data."
          echo ""
          echo "Existing PostgreSQL data retained."
          echo "Existing Random Forest forecast retained."
          echo "RF models were not restored."
          echo ""
          echo "The next scheduled check will try again."
          echo ""
          echo "=========================================="
